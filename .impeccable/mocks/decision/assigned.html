<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>FE Café: today (riso zine sketch)</title>
<style>
  :root { --paper:#f1efe9; --pink:#ff48b0; --blue:#3255a4; --yellow:#ffe800; --purple:#765ba7; --ink:#1d1b33; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    background-image: radial-gradient(rgba(29,27,51,.07) 1px, transparent 1.2px); background-size: 6px 6px; }
  .mast { display: flex; align-items: center; gap: 28px; padding: 22px 48px; border-bottom: 3px solid var(--blue); }
  .mast .name { font-size: 30px; color: var(--blue); letter-spacing: -.02em; }
  .mast .issue { font-size: 14px; font-family: "Courier New", monospace; color: var(--pink); }
  .mast nav { margin-left: auto; display: flex; gap: 26px; font-family: Arial, sans-serif; font-weight: 700; font-size: 15px; }
  .spread { display: grid; grid-template-columns: 1fr 3px 1.15fr; height: calc(900px - 78px); }
  .gutter { background: repeating-linear-gradient(var(--blue) 0 10px, transparent 10px 18px); opacity: .5; }
  .left { padding: 44px 48px; position: relative; }
  .date { font-size: 200px; line-height: .82; letter-spacing: -.06em; position: relative; }
  .date .a { color: var(--pink); mix-blend-mode: multiply; position: absolute; left: 0; top: 0; }
  .date .b { color: var(--blue); mix-blend-mode: multiply; position: relative; left: 7px; top: 5px; opacity: .9; }
  .count { margin-top: 26px; display: inline-flex; align-items: baseline; gap: 14px; background: var(--yellow); padding: 10px 18px; transform: rotate(-1.5deg); }
  .count b { font-size: 64px; color: var(--ink); }
  .count span { font-size: 22px; font-family: Arial, sans-serif; font-weight: 700; }
  .month { margin-top: 34px; display: grid; grid-template-columns: repeat(7, 46px); gap: 6px; }
  .month i { width: 46px; height: 40px; border: 2px solid var(--blue); display: block; position: relative; }
  .month i.on::after { content: ""; position: absolute; inset: 7px 11px; border-radius: 50%; background: var(--pink); mix-blend-mode: multiply; }
  .month i.today { background: var(--yellow); }
  .right { padding: 44px 56px; position: relative; }
  .kicker { font-family: "Courier New", monospace; font-size: 16px; color: var(--pink); letter-spacing: .12em; }
  .problem { margin-top: 14px; font-size: 64px; line-height: .95; color: var(--blue); max-width: 620px; }
  .code { margin-top: 24px; width: 560px; height: 170px; border: 3px solid var(--ink); background: #fff; position: relative; }
  .code::before { content: ""; position: absolute; inset: 12px 18px; background: repeating-linear-gradient(var(--ink) 0 9px, transparent 9px 26px); opacity: .7; }
  .engraving { position: absolute; right: 48px; top: 120px; width: 300px; height: 360px;
    background: radial-gradient(circle at 50% 38%, var(--purple) 0 30%, transparent 31%), radial-gradient(circle at 46% 74%, var(--pink) 0 34%, transparent 35%);
    mix-blend-mode: multiply; opacity: .85; filter: contrast(1.2); }
  .start { position: absolute; left: 56px; bottom: 64px; display: flex; gap: 18px; align-items: center; }
  .btn { font-size: 34px; background: var(--pink); color: #fff; padding: 22px 40px; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--blue); }
  .ghost { font-size: 24px; color: var(--blue); border-bottom: 4px solid var(--yellow); }
</style>
</head>
<body>
  <header class="mast"><span class="name">FE CAFÉ</span><span class="issue">ISSUE #301 · FRIDAY</span>
    <nav><span>Today</span><span>Topics</span><span>Night Shift</span><span>Studio</span><span>Calendar</span></nav></header>
  <main class="spread">
    <section class="left">
      <div class="date"><span class="a">OCT 30</span><span class="b">OCT 30</span></div>
      <div class="count"><b>79</b><span>days to the January FE</span></div>
      <div class="month">
        <i class="on"></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i>
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i>
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="today"></i><i></i><i></i><i></i>
      </div>
    </section>
    <div class="gutter"></div>
    <section class="right">
      <div class="kicker">TODAY'S PROBLEM · HEAPS · 2 OF 3 ★★</div>
      <h1 class="problem">Where does 42 sink to?</h1>
      <div class="code"></div>
      <div class="engraving" aria-hidden="true"></div>
      <div class="start"><span class="btn">Solve it ▸</span><span class="ghost">then a 25-min focus</span></div>
    </section>
  </main>
</body>
</html>
