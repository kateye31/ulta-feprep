<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>FE Café: today (collectible cards sketch)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; background: #3d3a5c; color: #2c2540; font-family: "Trebuchet MS", Arial, sans-serif;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 5px 5px; }
  header { display: flex; align-items: center; padding: 26px 56px; color: #fbf3e4; }
  header .name { font-size: 30px; font-weight: 900; }
  header nav { margin-left: auto; display: flex; gap: 26px; font-size: 16px; font-weight: 700; }
  h1 { color: #fbf3e4; font-size: 52px; padding: 10px 56px 0; font-weight: 900; }
  .hand { display: flex; gap: 40px; padding: 40px 56px; align-items: flex-end; }
  .card { width: 380px; border-radius: 26px; padding: 22px; box-shadow: 0 18px 0 rgba(0,0,0,.25); }
  .card .top { display: flex; justify-content: space-between; font-size: 34px; font-weight: 900; }
  .card .pic { margin: 16px 0; height: 230px; border-radius: 14px; background: #fbf3e4; border: 4px solid rgba(0,0,0,.15); }
  .card .bar { background: rgba(0,0,0,.12); border-radius: 999px; padding: 10px 16px; font-size: 22px; font-weight: 900; }
  .card .txt { margin-top: 14px; background: #fbf3e4; border-radius: 14px; height: 120px; }
  .main { background: #f2c14e; transform: rotate(-3deg) translateY(-20px); width: 430px; }
  .side { background: #7cb7e8; transform: rotate(2deg); }
  .bonus { background: #f3a6c8; transform: rotate(5deg); }
</style>
</head>
<body>
  <header><span class="name">FE Café</span><nav><span>Today</span><span>Topics</span><span>Night Shift</span><span>Studio</span><span>Binder</span></nav></header>
  <h1>Your hand for Friday</h1>
  <div class="hand">
    <div class="card main"><div class="top"><span>MAIN</span><span>+100</span></div><div class="pic"></div><div class="bar">HEAPIFY ★★☆</div><div class="txt"></div></div>
    <div class="card side"><div class="top"><span>SIDE</span><span>+50</span></div><div class="pic"></div><div class="bar">25-MIN FOCUS</div><div class="txt"></div></div>
    <div class="card bonus"><div class="top"><span>BONUS</span><span>🔥 6</span></div><div class="pic"></div><div class="bar">79 DAYS LEFT</div><div class="txt"></div></div>
  </div>
</body>
</html>
